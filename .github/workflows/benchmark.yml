name: EternalPhoenix vs Stockfish

on:
  push:
    branches: [ main, benchmark ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install match dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade python-chess
          python3 - <<'PY'
          import chess
          print('python-chess', chess.__version__)
          PY

      - name: Reconstruct EternalPhoenix source
        shell: bash
        run: |
          set -euo pipefail
          cat engine/part0 engine/part1 engine/part23 > EternalPhoenix.cpp
          python3 - <<'PY'
          p='EternalPhoenix.cpp'
          s=open(p, encoding='utf-8').read()
          dup='KING)];return x?__builtin_ctzll(x):-1;}'
          hits=[i for i in range(len(s)) if s.startswith(dup, i)]
          if len(hits) != 2:
              raise SystemExit(f'expected 2 occurrences of split boundary, found {len(hits)}')
          i=hits[-1]
          s=s[:i]+s[i+len(dup):]
          open(p,'w',encoding='utf-8').write(s)
          PY
          wc -c EternalPhoenix.cpp

      - name: Build EternalPhoenix
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -std=c++17 -march=native -pthread EternalPhoenix.cpp -o EternalPhoenix
          ./EternalPhoenix bench 2>&1 | tee local-benchmark.txt

      - name: Build Stockfish
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/official-stockfish/Stockfish.git stockfish
          make -C stockfish/src -j2 build ARCH=x86-64
          ./stockfish/src/stockfish <<'EOF'
          uci
          isready
          quit
          EOF

      - name: Engine match
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/match.py ./EternalPhoenix ./stockfish/src/stockfish | tee match-results.txt
          test -s match-results.txt
          grep -q '^SUMMARY ' match-results.txt
          test -s games.pgn

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eternalphoenix-benchmark
          path: |
            local-benchmark.txt
            match-results.txt
            games.pgn
